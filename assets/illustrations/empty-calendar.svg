<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E4DB5"/>
      <stop offset="100%" stop-color="#7A3E9D"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="120" r="90" fill="#FAF5FF"/>
  <!-- Calendar Pad -->
  <g transform="translate(160, 120)">
    <rect x="-48" y="-40" width="96" height="84" rx="12" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2"/>
    <!-- Header bar -->
    <path d="M -48 -28 C -48 -35, -42 -40, -36 -40 L 36 -40 C 42 -40, 48 -35, 48 -28 L 48 -15 L -48 -15 Z" fill="url(#calGrad)"/>
