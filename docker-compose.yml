services:
  postgres:
    image: postgres:16-alpine
    container_name: bccteams-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bccteams}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bccteams-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: bccteams-seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333 -s3.allowEmptyFolder=true"
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweed_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: bccteams-livekit
    restart: unless-stopped
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
