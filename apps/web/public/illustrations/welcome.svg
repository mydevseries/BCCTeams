<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="welBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149AA7"/>
      <stop offset="100%" stop-color="#0E7C86"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="300" rx="20" fill="#F8FAFC"/>
  <!-- Center Emblem -->
  <g transform="translate(200, 120)">
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="url(#welBg)"/>
    <text x="0" y="14" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="34">BCC</text>
  </g>
  <!-- Welcome text & decorative dots -->
  <text x="200" y="215" text-anchor="middle" fill="#0E7C86" font-family="sans-serif" font-weight="800" font-size="22">Welcome to BCC Teams</text>
  <text x="200" y="240" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="14">All your chats, channels, calls and files in one place.</text>
</svg>