<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary Brand Teal Gradient -->
    <linearGradient id="bccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149AA7"/>
      <stop offset="50%" stop-color="#0E7C86"/>
      <stop offset="100%" stop-color="#07535B"/>
    </linearGradient>

    <!-- Top Soft Highlight -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Speech Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBF8F9"/>
    </linearGradient>

    <!-- Accent Chat Pill -->
    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#032023" flood-opacity="0.32"/>
    </filter>
    <filter id="motifShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#032023" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Badge (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bccBg)" filter="url(#badgeShadow)"/>

  <!-- Subtle Inner Border -->
  <rect x="34" y="34" width="444" height="444" rx="102" ry="102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Top Glass Highlight / Sheen -->
  <path d="M 36 136 C 36 80, 80 36, 136 36 L 376 36 C 432 36, 476 80, 476 136 C 476 210, 36 230, 36 136 Z" fill="url(#topGlow)"/>

  <!-- Motif: Collaborative Speech Bubbles -->
  <g filter="url(#motifShadow)">
    <!-- Secondary Companion Bubble (accent teal-cyan) -->
    <path d="M 310 135 
             C 310 114, 328 98, 352 98 
             C 376 98, 395 114, 395 135 
             C 395 152, 382 166, 365 170 
             L 370 186 
             L 352 172 
             C 352 172, 352 172, 352 172 
             C 328 172, 310 156, 310 135 Z" 
          fill="url(#accentPill)" opacity="0.95"/>

    <!-- Main Speech Bubble -->
    <path d="M 160 140 
             C 160 102, 190 74, 235 74 
             C 280 74, 310 102, 310 140 
             C 310 174, 282 201, 240 205 
             L 218 226 
             C 214 230, 208 227, 210 221 
             L 215 204 
             C 182 198, 160 172, 160 140 Z" 
          fill="url(#bubbleGrad)"/>

    <!-- Three Message Dots inside Main Bubble -->
    <circle cx="202" cy="140" r="9" fill="#0E7C86"/>
    <circle cx="235" cy="140" r="9" fill="#0E7C86"/>
    <circle cx="268" cy="140" r="9" fill="#0E7C86"/>
  </g>

  <!-- Typography: Clean Bold Sans-Serif "BCC" -->
  <text x="256" y="372"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="142"
        letter-spacing="5"
        filter="url(#motifShadow)">BCC</text>
</svg>
