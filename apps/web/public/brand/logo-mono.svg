<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="monoMask">
      <!-- White reveals, Black cuts out -->
      <rect width="512" height="512" fill="#FFFFFF"/>

      <!-- Secondary Accent Bubble cutout -->
      <path d="M 310 135 
               C 310 114, 328 98, 352 98 
               C 376 98, 395 114, 395 135 
               C 395 152, 382 166, 365 170 
               L 370 186 
               L 352 172 
               C 328 172, 310 156, 310 135 Z" 
            fill="#000000"/>

      <!-- Main Speech Bubble cutout -->
      <path d="M 160 140 
               C 160 102, 190 74, 235 74 
               C 280 74, 310 102, 310 140 
               C 310 174, 282 201, 240 205 
               L 218 226 
               C 214 230, 208 227, 210 221 
               L 215 204 
               C 182 198, 160 172, 160 140 Z" 
            fill="#000000"/>

      <!-- 3 Dots inside main bubble (kept white so they show in solid currentColor) -->
      <circle cx="202" cy="140" r="9" fill="#FFFFFF"/>
      <circle cx="235" cy="140" r="9" fill="#FFFFFF"/>
      <circle cx="268" cy="140" r="9" fill="#FFFFFF"/>

      <!-- Typography "BCC" cutout -->
      <text x="256" y="372"
            text-anchor="middle"
            fill="#000000"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-weight="900"
            font-size="142"
            letter-spacing="5">BCC</text>
    </mask>
  </defs>

  <!-- Solid Badge with Cutouts via Mask -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="currentColor" mask="url(#monoMask)"/>
</svg>

